apiVersion: v1
kind: Pod
metadata:
  name: privileged
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/component: test
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: lab3.local/shop-api:v1
      imagePullPolicy: Never
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        capabilities:
          drop: [ALL]
