apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.critical.name }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.critical.value }}
globalDefault: false
description: Critical path of shop (api, postgres)
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClasses.low.name }}
  labels:
    {{- include "shop.labels" . | nindent 4 }}
value: {{ .Values.priorityClasses.low.value }}
globalDefault: false
description: Sacrificable background load (batch)
