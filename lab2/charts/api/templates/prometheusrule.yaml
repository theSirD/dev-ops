{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "api.name" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  groups:
    - name: api.rules
      rules:
        - alert: ApiHighErrorRate
          expr: |
            (
              sum(rate(http_requests_total{path="/fail",code=~"5.."}[2m]))
              /
              clamp_min(sum(rate(http_requests_total[2m])), 1e-9)
            ) > {{ .Values.alerts.errorRateThreshold }}
            or
            (
              sum(rate(http_errors_total[2m]))
              /
              clamp_min(sum(rate(http_requests_total[2m])), 1e-9)
            ) > {{ .Values.alerts.errorRateThreshold }}
          for: {{ .Values.alerts.for }}
          labels:
            severity: critical
            service: api
          annotations:
            summary: "API error rate is above threshold"
            description: "Users are getting 5xx responses. Check /fail traffic, recent deploys and Jaeger error spans."
            runbook: "Inspect Grafana RED dashboard and Loki error logs; roll back if a release correlates."

        - alert: ApiHighLatencyP95
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket[5m]))
            ) > {{ .Values.alerts.latencyP95Seconds }}
          for: {{ .Values.alerts.for }}
          labels:
            severity: critical
            service: api
          annotations:
            summary: "API p95 latency is above {{ .Values.alerts.latencyP95Seconds }}s"
            description: "End-user experience is degraded. Look at /slow traces and nested slow-op spans in Jaeger."
            runbook: "Find slow traces in Jaeger, check resource saturation on api pods, scale or fix the slow path."

        - alert: ApiDown
          expr: |
            absent(up{namespace="app", service="api"} == 1)
            or
            max(up{namespace="app", service="api"}) == 0
          for: {{ .Values.alerts.for }}
          labels:
            severity: critical
            service: api
          annotations:
            summary: "API scrape target is down or missing"
            description: "Prometheus cannot scrape the API. The service may be scaled to zero or pods are CrashLooping."
            runbook: "kubectl get pods -n app; check events and restarts; restore replicas or fix the crash."
{{- end }}
