apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: batch
spec:
  replicas: {{ .Values.batch.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: batch
  template:
    metadata:
      labels:
        {{- include "shop.labels" . | nindent 8 }}
        app.kubernetes.io/component: batch
    spec:
      priorityClassName: {{ .Values.batch.priorityClassName | quote }}
      {{- with .Values.batch.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: batch
          image: {{ .Values.batch.image | quote }}
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MEMORY_MB
              value: {{ .Values.batch.memoryMb | quote }}
            - name: CPU_WORK
              value: {{ .Values.batch.cpuWork | quote }}
            - name: CPU_DUTY
              value: {{ .Values.batch.cpuDuty | quote }}
          resources:
            {{- toYaml .Values.batch.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
