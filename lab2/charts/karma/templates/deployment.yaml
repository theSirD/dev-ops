apiVersion: apps/v1
kind: Deployment
metadata:
  name: karma
  labels:
    app: karma
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: karma
  template:
    metadata:
      labels:
        app: karma
    spec:
      containers:
        - name: karma
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --alertmanager.uri={{ .Values.alertmanagerUri }}
            - --alertmanager.proxy
            - --listen.address=0.0.0.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
