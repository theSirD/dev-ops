apiVersion: v1
kind: Pod
metadata:
  name: missing-labels
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: lab3.local/shop-api:v1
      imagePullPolicy: Never
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
