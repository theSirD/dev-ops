# Karma — dashboard over Alertmanager alerts.
replicaCount: 1

image:
  repository: ghcr.io/prymitive/karma
  tag: "v0.121"
  pullPolicy: IfNotPresent

env:
  - name: ALERTMANAGER_URI
    value: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
  - name: ALERTMANAGER_PROXY
    value: "true"
  - name: LISTEN_ADDRESS
    value: "0.0.0.0:8080"

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 64Mi
