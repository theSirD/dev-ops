apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  labels:
    app.kubernetes.io/component: collector
    {{- include "jaeger-services.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.jaeger.selector | nindent 4 }}
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-query
  labels:
    app.kubernetes.io/component: query
    {{- include "jaeger-services.labels" . | nindent 4 }}
spec:
  selector:
    {{- toYaml .Values.jaeger.selector | nindent 4 }}
  ports:
    - name: http-query
      port: 16686
      targetPort: 16686
