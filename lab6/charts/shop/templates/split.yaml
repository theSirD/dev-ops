{{- if and .Values.mesh.enabled .Values.api.versions.v1.enabled .Values.api.versions.v2.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api-split
  labels:
    {{- include "shop.labels" . | nindent 4 }}
  {{- if .Values.mesh.retries.enabled }}
  annotations:
    retry.linkerd.io/http: {{ .Values.mesh.retries.http | quote }}
    retry.linkerd.io/limit: {{ .Values.mesh.retries.limit | quote }}
  {{- end }}
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: api
      port: {{ .Values.api.port }}
  rules:
    - backendRefs:
        - name: api-v1
          port: {{ .Values.api.port }}
          weight: {{ sub 100 (int .Values.api.canary.weight) }}
        - name: api-v2
          port: {{ .Values.api.port }}
          weight: {{ int .Values.api.canary.weight }}
{{- end }}
