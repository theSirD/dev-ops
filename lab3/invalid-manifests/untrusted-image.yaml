apiVersion: v1
kind: Pod
metadata:
  name: untrusted-image
  labels:
    app.kubernetes.io/name: policy-test
    app.kubernetes.io/component: test
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: docker.io/library/busybox:1.36
      command: ["sleep", "3600"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 50m, memory: 64Mi}
      securityContext:
        privileged: false
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
