apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "shop.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "shop.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ .Values.api.image | quote }}
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: DATABASE_URL
              value: postgresql://app:app@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/shop
            - name: HEALTH_FAIL
              value: {{ .Values.api.healthFail | quote }}
          lifecycle:
            preStop:
              sleep:
                seconds: {{ .Values.api.preStopSleepSeconds }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "shop.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  {{- if eq .Values.api.service.type "NodePort" }}
  externalTrafficPolicy: {{ .Values.api.service.externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "shop.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
