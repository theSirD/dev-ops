name: lab8-release
services:
  ollama:
    image: ollama/ollama@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    gpus: all
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '4096'
      OLLAMA_KEEP_ALIVE: '10m'
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    environment:
      N8N_METRICS: 'true'
      N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS: 'true'
      N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL: 'true'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_CONCURRENCY_PRODUCTION_LIMIT: '1'
      GENERIC_TIMEZONE: Europe/Moscow
      N8N_SECURE_COOKIE: 'false'
    ports:
      - '127.0.0.1:5678:5678'
    volumes:
      - n8n:/home/node/.n8n
      - ./:/lab:ro
    restart: unless-stopped
  git-mcp:
    build: ./mcp
    image: lab8-mcp:1
    command: ['--config', '/config/git.json']
    volumes:
      - ./mcp/git.json:/config/git.json:ro
      - ./fixtures/repository:/data/repository:ro
    restart: unless-stopped
  filesystem-mcp:
    image: lab8-mcp:1
    command: ['--config', '/config/filesystem.json']
    volumes:
      - ./mcp/filesystem.json:/config/filesystem.json:ro
      - ./fixtures/evidence:/data/evidence:ro
      - ./reports:/data/reports
    restart: unless-stopped
  prometheus:
    image: prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=2d']
    ports:
      - '127.0.0.1:9098:9090'
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.1@sha256:e932bd6ed0e026595b08483cd0141e5103e1ab7ff8604839ff899b8dc54cabcb
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}'
    ports:
      - '127.0.0.1:3008:3000'
    volumes:
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboard.json:/var/lib/grafana/dashboards/release.json:ro
      - grafana:/var/lib/grafana
    restart: unless-stopped
volumes:
  ollama:
  n8n:
  prometheus:
  grafana:
